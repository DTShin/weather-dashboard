name: t2
"on":
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Pages repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout wxtrack source
        uses: actions/checkout@v4
        with:
          repository: DTShin/wxtrack
          path: src
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r src/requirements.txt
      - name: Would-run pipeline
        working-directory: src
        run: |
          echo "pretend collect_forecast"
          echo "pretend predict"
      - name: Copy dashboard
        run: |
          cp -r src/dashboard/* . || true
          rm -rf src
      - name: Commit and push
        run: |
          git config user.name "bot"
          git config user.email "bot@x.io"
          git add -A
          git commit -m "probe" || true
          git push || true
