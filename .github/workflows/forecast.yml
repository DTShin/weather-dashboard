name: wxtrack forecast refresh

# 云端定时刷新气象看板（纯 shell，不依赖任何第三方 action，
# 以兼容仓库「Actions 权限策略」可能限制第三方 action 的情况）：
#   1) 把公开源码仓 DTShin/wxtrack 克隆进工作区根目录（使 GITHUB_WORKSPACE 指向 wxtrack 根，
#      保证 pm_refresh / gen_dashboard 等脚本的 ROOT 解析一致）
#   2) 从 db-store Release 恢复持久化 SQLite（含历史实测/偏差），保证实测·误差列非空
#   3) 系统自带 python3 + pip 安装依赖
#   4) 跑全链路：Open-Meteo 12 模型预报 -> 研判 -> 实测采集 -> 偏差统计 -> 生成看板 -> 降雨 -> 刷 Polymarket 价
#   5) 克隆本仓(weather-dashboard)到 out/，拷入 dashboard/*，用 GITHUB_TOKEN 推回(main)，Pages 自动重建
#   6) 裁剪 forecast_snapshot 旧历史 + 把最新 SQLite 存回 db-store Release（clobber）
# 全程公开 API、无密钥；GITHUB_TOKEN 已在本仓 settings/actions 开启 Read and write。
"on":
  schedule:
    - cron: "17 */6 * * *"        # 每 6 小时一次(UTC 00:17/06:17/12:17/18:17)
  workflow_dispatch:              # 允许手动触发

permissions:
  contents: write                 # 推回本仓 + 操作 release 所需
  pages: write                    # 推送后显式触发 Pages 重建

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Clone wxtrack source into workspace root
        run: |
          git clone --depth 1 https://github.com/DTShin/wxtrack.git _wxtmp
          cp -r _wxtmp/. .
          rm -rf .git _wxtmp

      - name: Restore persistent DB from db-store release
        run: |
          mkdir -p data
          AURL=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/DTShin/weather-dashboard/releases/tags/db-store" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);a=d.get('assets',[]);print(a[0]['url'] if a else '')" 2>/dev/null)
          if [ -n "$AURL" ]; then
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/octet-stream" \
              "$AURL" -o data/wxtrack.db
            echo "DB 已恢复: $(ls -la data/wxtrack.db | awk '{print $5}') bytes"
            echo "RESTORED=1" >> "$GITHUB_ENV"
          else
            echo "未找到 db-store 资产，本次从空库开始（不覆盖上传）"
            echo "RESTORED=0" >> "$GITHUB_ENV"
          fi

      - name: Install Python deps
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Run forecast pipeline (with obs + bias)
        run: |
          python3 scripts/collect_forecast.py --skip-meteoblue
          python3 scripts/predict.py
          python3 scripts/collect_obs.py --skip-wu
          python3 scripts/stats_bias.py --window 30
          python3 scripts/gen_dashboard.py
          python3 scripts/collect_precip.py --patch
          python3 scripts/pm_refresh.py --no-push

      - name: Validate generated data
        run: python3 -c "import json;d=json.load(open('dashboard/data.json'));assert d.get('cities'),'empty cities';print('cities:',len(d['cities']),'| global.obs_n:',d['global'].get('obs_n'),'| sample obs rows:',len(d['cities'][0].get('obs',[])))"

      - name: Clone Pages repo and publish
        run: |
          git clone --depth 1 https://x-access-token:${GH_TOKEN}@github.com/DTShin/weather-dashboard.git out
          cd out
          cp -r ../dashboard/* .
          [ -f ../dashboard/.nojekyll ] && cp ../dashboard/.nojekyll .
          git config user.name "wxtrack-bot"
          git config user.email "bot@dtshin.xyz"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes; skip"
            exit 0
          fi
          git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/DTShin/weather-dashboard/pages/builds \
            && echo "Pages rebuild triggered" || echo "Pages rebuild trigger skipped"

      - name: Prune history and persist DB back to db-store release
        if: env.RESTORED == '1'
        run: |
          python3 -c "import sqlite3; from datetime import date,timedelta; p='data/wxtrack.db'; c=sqlite3.connect(p); cut=(date.today()-timedelta(days=7)).isoformat(); c.execute('DELETE FROM forecast_snapshot WHERE target_date < ?',(cut,)); c.execute('DELETE FROM judgment_snapshot WHERE target_date < ?',(cut,)); c.commit(); c.close(); c2=sqlite3.connect(p,isolation_level=None); c2.execute('VACUUM'); c2.close(); print('pruned; forecast_snapshot left:', sqlite3.connect(p).execute('SELECT COUNT(*) FROM forecast_snapshot').fetchone()[0])"
          RELID=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/DTShin/weather-dashboard/releases/tags/db-store" \
            | python3 -c "import sys,json;print(json.load(sys.stdin).get('id',''))")
          AID=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/DTShin/weather-dashboard/releases/${RELID}/assets" \
            | python3 -c "import sys,json;a=json.load(sys.stdin);print(a[0]['id'] if a else '')")
          [ -n "$AID" ] && curl -fsSL -X DELETE -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/DTShin/weather-dashboard/releases/assets/${AID}"
          UP=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/DTShin/weather-dashboard/releases/${RELID}" \
            | python3 -c "import sys,json;print(json.load(sys.stdin)['upload_url'].replace('{?name,label}',''))")
          curl -fsSL -X POST -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @data/wxtrack.db \
            "${UP}?name=wxtrack.db" && echo "DB persisted to db-store" || echo "DB persist failed"
